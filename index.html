<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHÓM HOÁ - Đội Hình Trong Mơ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Teko', sans-serif;
            background-color: #06142e;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(20, 50, 100, 0.8) 0%, rgba(6, 20, 46, 0.95) 100%),
                url('https://images.unsplash.com/photo-1518605368461-1e1e38ce151d?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #e2e8f0;
            font-size: 1.2rem;
            margin: 0;
            padding: 0;
        }

        .glass-panel {
            background: rgba(10, 25, 55, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(45, 212, 191, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .neon-text {
            color: #2dd4bf;
            text-shadow: 0 0 10px rgba(45, 212, 191, 0.6);
        }

        .neon-border {
            border: 1px solid #2dd4bf;
            box-shadow: 0 0 10px rgba(45, 212, 191, 0.3);
        }

        .fut-card {
            background: linear-gradient(135deg, rgba(20, 40, 90, 0.9) 0%, rgba(10, 15, 30, 0.95) 100%);
            border: 2px solid #eab308;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }
        .fut-card:hover { transform: translateY(-5px); }
        .fut-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.15), transparent);
            transform: skewX(-25deg);
            animation: shine 4s infinite;
        }
        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .nav-btn { transition: all 0.3s; cursor: pointer; }
        .nav-btn.active { 
            background: rgba(45, 212, 191, 0.2); 
            border-bottom: 3px solid #2dd4bf; 
            color: #2dd4bf; 
        }
        .nav-btn:hover:not(.active) { background: rgba(45, 212, 191, 0.1); }

        #custom-modal { display: none; }
        #custom-modal.active { display: flex; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4">

    <!-- Phần Tiêu đề & Menu -->
    <div class="w-full max-w-6xl glass-panel rounded-2xl p-6 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-4">
            <div class="w-16 h-16 rounded-full border-2 border-[#2dd4bf] flex items-center justify-center bg-blue-900 shadow-[0_0_15px_rgba(45,212,191,0.5)]">
                <i class="fas fa-futbol text-3xl text-[#2dd4bf] animate-bounce"></i>
            </div>
            <div>
                <h1 class="text-4xl font-bold text-white tracking-wider">NHÓM <span class="text-yellow-400">HOÁ</span></h1>
                <div class="flex items-center gap-2 text-sm text-gray-300">
                    <div id="status-dot" class="w-3 h-3 rounded-full bg-red-500 shadow-[0_0_8px_#ef4444]"></div>
                    <span id="status-text" class="font-sans text-sm">Đang kết nối trung tâm dữ liệu...</span>
                </div>
            </div>
        </div>
        
        <div class="flex flex-wrap justify-center gap-2">
            <button onclick="switchTab('members')" id="tab-members" class="nav-btn active px-5 py-2 rounded-t-lg font-semibold uppercase tracking-wide"><i class="fas fa-users mr-2"></i>Đội hình</button>
            <button onclick="switchTab('docs')" id="tab-docs" class="nav-btn px-5 py-2 rounded-t-lg font-semibold uppercase tracking-wide"><i class="fas fa-folder-open mr-2"></i>Tài liệu</button>
            <button onclick="switchTab('tasks')" id="tab-tasks" class="nav-btn px-5 py-2 rounded-t-lg font-semibold uppercase tracking-wide"><i class="fas fa-tasks mr-2"></i>Bài tập</button>
            <button onclick="switchTab('game')" id="tab-game" class="nav-btn px-5 py-2 rounded-t-lg font-semibold uppercase tracking-wide"><i class="fas fa-gamepad mr-2"></i>Sút Phạt</button>
        </div>
    </div>

    <!-- Khu vực hiển thị nội dung -->
    <div id="content-area" class="w-full max-w-6xl">
        
        <!-- Tab 1: Đội hình -->
        <div id="view-members" class="space-y-6">
            <div class="glass-panel rounded-xl p-6 neon-border">
                <h2 class="text-2xl font-bold mb-4 neon-text"><i class="fas fa-user-plus mr-2"></i>Chiêu Mộ Tân Binh</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="member-name" placeholder="Tên cầu thủ..." class="bg-blue-950/60 border border-blue-500 rounded p-3 text-white font-sans text-base focus:outline-none focus:border-teal-400">
                    <div class="relative bg-blue-950/60 border border-blue-500 rounded p-3 text-white flex items-center justify-between cursor-pointer hover:border-teal-400 font-sans text-base">
                        <span id="file-name-display" class="truncate text-gray-300">Ảnh đại diện (Chọn tệp)</span>
                        <i class="fas fa-upload text-teal-400"></i>
                        <input type="file" id="member-avatar" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" onchange="document.getElementById('file-name-display').innerText = this.files[0] ? this.files[0].name : 'Ảnh đại diện (Chọn tệp)'">
                    </div>
                    <input type="url" id="member-link" placeholder="Link Facebook/Zalo..." class="bg-blue-950/60 border border-blue-500 rounded p-3 text-white font-sans text-base focus:outline-none focus:border-teal-400">
                </div>
                <button id="btn-add-member" class="mt-4 w-full bg-teal-500 hover:bg-teal-400 text-slate-900 font-bold py-3 rounded uppercase tracking-widest transition-all text-xl"><i class="fas fa-signature mr-2"></i>Ký Hợp Đồng</button>
            </div>
            <div id="members-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <div class="col-span-full text-center py-10 text-gray-400"><i class="fas fa-spinner fa-spin text-4xl mb-3"></i><br>Đang tải đội hình...</div>
            </div>
        </div>

        <!-- Tab 2: Tài liệu -->
        <div id="view-docs" class="hidden space-y-6">
            <div class="glass-panel rounded-xl p-6 neon-border">
                <h2 class="text-2xl font-bold mb-4 neon-text"><i class="fas fa-file-upload mr-2"></i>Gửi Tài Liệu Chiến Thuật</h2>
                <div class="flex flex-col md:flex-row gap-4">
                    <input type="text" id="doc-title" placeholder="Tên tài liệu..." class="flex-1 bg-blue-950/60 border border-blue-500 rounded p-3 text-white font-sans text-base focus:outline-none focus:border-teal-400">
                    <input type="url" id="doc-url" placeholder="Link tài liệu (Drive, Docs...)" class="flex-1 bg-blue-950/60 border border-blue-500 rounded p-3 text-white font-sans text-base focus:outline-none focus:border-teal-400">
                    <button id="btn-add-doc" class="bg-teal-500 hover:bg-teal-400 text-slate-900 font-bold py-3 px-8 rounded uppercase tracking-widest text-xl"><i class="fas fa-paper-plane"></i> Gửi</button>
                </div>
            </div>
            <div id="docs-list" class="space-y-3"></div>
        </div>

        <!-- Tab 3: Bài tập -->
        <div id="view-tasks" class="hidden space-y-6">
            <div class="glass-panel rounded-xl p-6 neon-border">
                <h2 class="text-2xl font-bold mb-4 neon-text"><i class="fas fa-dumbbell mr-2"></i>Giao Bài Tập Huấn Luyện</h2>
                <div class="flex flex-col md:flex-row gap-4">
                    <input type="text" id="task-title" placeholder="Nội dung bài tập..." class="flex-1 bg-blue-950/60 border border-blue-500 rounded p-3 text-white font-sans text-base focus:outline-none focus:border-teal-400">
                    <button id="btn-add-task" class="bg-teal-500 hover:bg-teal-400 text-slate-900 font-bold py-3 px-8 rounded uppercase tracking-widest text-xl"><i class="fas fa-plus"></i> Thêm</button>
                </div>
            </div>
            <div id="tasks-list" class="space-y-3"></div>
        </div>

        <!-- Tab 4: Game -->
        <div id="view-game" class="hidden">
            <div class="glass-panel rounded-xl p-6 neon-border flex flex-col items-center">
                <h2 class="text-4xl font-bold mb-2 text-yellow-400">SÚT PHẠT ĐỀN</h2>
                <p class="text-gray-300 mb-4 font-sans text-sm">Canh chuẩn thủ môn, click chuột vào gôn để sút bóng!</p>
                <div class="relative w-full max-w-[700px] aspect-[4/3] bg-green-700 border-4 border-white rounded-lg cursor-crosshair overflow-hidden shadow-[inset_0_0_50px_rgba(0,0,0,0.5)]" id="game-container">
                    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[60%] h-[30%] border-b-4 border-l-4 border-r-4 border-white bg-[url('https://www.transparenttextures.com/patterns/net.png')]"></div>
                    <div id="goalkeeper" class="absolute top-[25%] left-1/2 -translate-x-1/2 w-14 h-14 bg-red-600 border-2 border-white rounded-full flex items-center justify-center transition-all duration-300 shadow-lg z-10"><i class="fas fa-hands text-white text-xl"></i></div>
                    <div id="ball" class="absolute bottom-[10%] left-1/2 -translate-x-1/2 w-10 h-10 bg-white rounded-full flex items-center justify-center text-black shadow-[0_5px_15px_rgba(0,0,0,0.5)] transition-all duration-500 z-20"><i class="fas fa-futbol text-2xl"></i></div>
                    <div id="game-score" class="absolute top-4 left-4 text-3xl font-bold text-white drop-shadow-md z-30">Điểm: 0</div>
                    <div id="game-msg" class="absolute inset-0 flex items-center justify-center text-5xl font-bold text-yellow-400 bg-black/60 hidden z-40 backdrop-blur-sm">VÀO!!!</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hộp thoại cảnh báo -->
    <div id="custom-modal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center font-sans">
        <div class="glass-panel neon-border p-6 rounded-xl max-w-sm w-full text-center">
            <div class="w-16 h-20 bg-red-600 border-2 border-white rounded flex items-center justify-center mx-auto mb-4 shadow-[0_0_15px_rgba(220,38,38,0.6)] rotate-12"></div>
            <h3 class="text-2xl font-bold mb-2 text-white font-teko">THẺ ĐỎ!</h3>
            <p id="modal-msg" class="text-gray-300 mb-6">Bạn có chắc chắn muốn xóa không?</p>
            <div class="flex gap-4 justify-center">
                <button id="modal-cancel" class="px-6 py-2 rounded bg-gray-600 hover:bg-gray-500 text-white font-bold transition">Hủy</button>
                <button id="modal-confirm" class="px-6 py-2 rounded bg-red-600 hover:bg-red-500 text-white font-bold transition">Xóa Bỏ</button>
            </div>
        </div>
    </div>

    <!-- Code kết nối Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

        // =========================================================================
        // DÁN THÔNG TIN FIREBASE CỦA BẠN VÀO ĐOẠN DƯỚI ĐÂY (GIỮ NGUYÊN DẤU NGOẶC KÉP "")
        // =========================================================================
        const firebaseConfig = {
             apiKey: "AIzaSyD4HZ1WMhcwvQbF2nCkpxE1JCcZcUQNWeg",
             authDomain: "nhom-hoa-app.firebaseapp.com",
  projectId: "nhom-hoa-app",
  storageBucket: "nhom-hoa-app.firebasestorage.app",
  messagingSenderId: "904960819246",
  appId: "1:904960819246:web:3435f976d519fca4fa1fbf",
  measurementId: "G-YWC7YFGBLR"
};
        // =========================================================================

        let app, db;
        
        const updateStatus = (isOk, text) => {
            document.getElementById('status-text').innerText = text;
            const dot = document.getElementById('status-dot');
            dot.className = `w-3 h-3 rounded-full ${isOk ? 'bg-green-400 shadow-[0_0_8px_#4ade80]' : 'bg-red-500 shadow-[0_0_8px_#ef4444]'}`;
        };

        try {
            if(firebaseConfig.apiKey.includes("DÁN_API_KEY_CỦA_BẠN_VÀO_ĐÂY")) {
                throw new Error("Chưa nhập cấu hình Firebase");
            }
            app = initializeApp(firebaseConfig);
            db = getDatabase(app);
            updateStatus(true, "Sân vận động đã sẵn sàng");
        } catch(e) {
            updateStatus(false, "Lỗi: Chưa kết nối máy chủ");
            document.getElementById('members-list').innerHTML = '<div class="col-span-full text-center text-red-400 py-10 font-sans">Lỗi: Bạn chưa dán mã cấu hình Firebase vào code!</div>';
            console.error(e);
        }

        window.switchTab = (tabId) => {
            ['members', 'docs', 'tasks', 'game'].forEach(id => {
                document.getElementById('view-' + id).classList.add('hidden');
                document.getElementById('tab-' + id).classList.remove('active');
            });
            document.getElementById('view-' + tabId).classList.remove('hidden');
            document.getElementById('tab-' + tabId).classList.add('active');
        };

        const showModal = (msg) => {
            return new Promise((resolve) => {
                const modal = document.getElementById('custom-modal');
                document.getElementById('modal-msg').innerText = msg;
                modal.classList.add('active');
                
                document.getElementById('modal-confirm').onclick = () => { modal.classList.remove('active'); resolve(true); };
                document.getElementById('modal-cancel').onclick = () => { modal.classList.remove('active'); resolve(false); };
            });
        };

        const resizeImageBase64 = (file) => {
            return new Promise((resolve) => {
                if(!file) return resolve(null);
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if(w > 150) { h = Math.round((h * 150) / w); w = 150; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    };
                };
            });
        };

        if(db) {
            onValue(ref(db, 'members'), (snapshot) => {
                const list = document.getElementById('members-list');
                list.innerHTML = '';
                const data = snapshot.val();
                if(!data) {
                    list.innerHTML = '<div class="col-span-full text-center text-gray-400 py-10 font-sans">Đội hình chưa có ai. Hãy chiêu mộ cầu thủ đầu tiên!</div>';
                    return;
                }
                Object.keys(data).forEach(id => {
                    const m = data[id];
                    const avatar = m.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(m.name)}&background=random&color=fff&size=150`;
                    list.innerHTML += `
                        <div class="fut-card p-4 flex flex-col items-center text-center">
                            <button onclick="deleteMember('${id}')" class="absolute top-2 right-2 text-red-400 hover:text-red-500 bg-black/50 rounded-full w-8 h-8 flex justify-center items-center"><i class="fas fa-times"></i></button>
                            <img src="${avatar}" class="w-24 h-24 rounded-full border-4 border-[#eab308] object-cover mb-3 shadow-[0_0_15px_rgba(234,179,8,0.5)]">
                            <h3 class="text-3xl font-bold text-white mb-1 uppercase tracking-wider flex items-center justify-center gap-2">
                                ${m.name} 
                                <button onclick="editMember('${id}', '${m.name}')" class="text-teal-400 text-base hover:text-white"><i class="fas fa-pen"></i></button>
                            </h3>
                            ${m.link ? `<a href="${m.link}" target="_blank" class="mt-1 px-4 py-1 rounded-full bg-blue-900/80 text-sm font-sans text-yellow-400 hover:text-white hover:bg-blue-800 transition"><i class="fas fa-external-link-alt mr-1"></i>Hồ sơ</a>` : ''}
                        </div>
                    `;
                });
            });

            document.getElementById('btn-add-member').onclick = async () => {
                const name = document.getElementById('member-name').value.trim();
                const link = document.getElementById('member-link').value.trim();
                const file = document.getElementById('member-avatar').files[0];
                if(!name) return alert("Vui lòng nhập tên cầu thủ!");
                
                document.getElementById('btn-add-member').innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Đang xử lý...';
                const avatarStr = await resizeImageBase64(file);
                
                push(ref(db, 'members'), { name, link, avatar: avatarStr, created: Date.now() })
                .then(() => {
                    document.getElementById('member-name').value = '';
                    document.getElementById('member-link').value = '';
                    document.getElementById('member-avatar').value = '';
                    document.getElementById('file-name-display').innerText = 'Ảnh đại diện (Chọn tệp)';
                }).finally(() => {
                    document.getElementById('btn-add-member').innerHTML = '<i class="fas fa-signature mr-2"></i>Ký Hợp Đồng';
                });
            };

            window.deleteMember = async (id) => { if(await showModal("Hủy hợp đồng với cầu thủ này?")) remove(ref(db, `members/${id}`)); };
            window.editMember = async (id, oldName) => {
                const newName = prompt("Đổi tên cầu thủ trên áo đấu:", oldName);
                if(newName && newName.trim() !== "") update(ref(db, `members/${id}`), { name: newName.trim() });
            };

            onValue(ref(db, 'docs'), (snapshot) => {
                const list = document.getElementById('docs-list');
                list.innerHTML = '';
                const data = snapshot.val();
                if(!data) return;
                Object.keys(data).forEach(id => {
                    const d = data[id];
                    list.innerHTML += `
                        <div class="glass-panel p-4 rounded-lg flex justify-between items-center neon-border hover:bg-blue-900/50 transition">
                            <a href="${d.url}" target="_blank" class="text-teal-400 font-bold hover:underline flex-1 text-2xl font-teko tracking-wide"><i class="fas fa-file-alt mr-3 text-yellow-400"></i>${d.title}</a>
                            <button onclick="deleteDoc('${id}')" class="text-red-400 hover:text-red-500 p-2 text-xl"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                });
            });

            document.getElementById('btn-add-doc').onclick = () => {
                const title = document.getElementById('doc-title').value.trim();
                const url = document.getElementById('doc-url').value.trim();
                if(title && url) {
                    push(ref(db, 'docs'), { title, url, created: Date.now() });
                    document.getElementById('doc-title').value = '';
                    document.getElementById('doc-url').value = '';
                }
            };
            window.deleteDoc = async (id) => { if(await showModal("Xóa tài liệu này khỏi hệ thống?")) remove(ref(db, `docs/${id}`)); };

            onValue(ref(db, 'tasks'), (snapshot) => {
                const list = document.getElementById('tasks-list');
                list.innerHTML = '';
                const data = snapshot.val();
                if(!data) return;
                Object.keys(data).forEach(id => {
                    const t = data[id];
                    list.innerHTML += `
                        <div class="glass-panel p-4 rounded-lg flex justify-between items-center border-l-4 ${t.done ? 'border-green-500 bg-green-900/30' : 'border-yellow-500 bg-yellow-900/30'}">
                            <div class="flex items-center gap-4 flex-1">
                                <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask('${id}', this.checked)" class="w-6 h-6 accent-teal-500 cursor-pointer">
                                <span class="${t.done ? 'line-through text-gray-500' : 'text-white'} text-2xl font-teko tracking-wide mt-1">${t.title}</span>
                            </div>
                            <button onclick="deleteTask('${id}')" class="text-red-400 hover:text-red-500 p-2 text-xl"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                });
            });

            document.getElementById('btn-add-task').onclick = () => {
                const title = document.getElementById('task-title').value.trim();
                if(title) {
                    push(ref(db, 'tasks'), { title, done: false, created: Date.now() });
                    document.getElementById('task-title').value = '';
                }
            };
            window.toggleTask = (id, done) => { update(ref(db, `tasks/${id}`), { done }); };
            window.deleteTask = async (id) => { if(await showModal("Hủy bài tập huấn luyện này?")) remove(ref(db, `tasks/${id}`)); };
        }

        let score = 0;
        const gc = document.getElementById('game-container');
        const ball = document.getElementById('ball');
        const gk = document.getElementById('goalkeeper');
        const msg = document.getElementById('game-msg');
        const scoreDisplay = document.getElementById('game-score');

        setInterval(() => {
            const randomX = Math.floor(Math.random() * 60) + 20;
            gk.style.left = randomX + '%';
        }, 600);

        gc.onclick = (e) => {
            if(ball.style.bottom !== '10%') return; 
            const rect = gc.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const targetPercentX = (clickX / rect.width) * 100;
            
            ball.style.bottom = '80%';
            ball.style.left = targetPercentX + '%';
            ball.style.transform = 'translate(-50%, -50%) scale(0.6) rotate(360deg)';
            
            setTimeout(() => {
                const gkRect = gk.getBoundingClientRect();
                const ballRect = ball.getBoundingClientRect();
                
                const isSaved = ballRect.top < gkRect.bottom && ballRect.bottom > gkRect.top &&
                               ballRect.left < gkRect.right && ballRect.right > gkRect.left;
                
                if(isSaved) {
                    msg.innerText = "THỦ MÔN CẢN PHÁ!";
                    msg.classList.replace('text-yellow-400', 'text-red-500');
                    score = 0;
                } else if (targetPercentX > 20 && targetPercentX < 80) { 
                    msg.innerText = "VÀO!!!";
                    msg.classList.replace('text-red-500', 'text-yellow-400');
                    score += 10;
                } else { 
                    msg.innerText = "RA NGOÀI!";
                    msg.classList.replace('text-yellow-400', 'text-gray-400');
                    score = 0;
                }
                
                scoreDisplay.innerText = "Điểm: " + score;
                msg.classList.remove('hidden');
                
                setTimeout(() => {
                    msg.classList.add('hidden');
                    ball.style.transition = 'none';
                    ball.style.bottom = '10%';
                    ball.style.left = '50%';
                    ball.style.transform = 'translate(-50%, 0) scale(1) rotate(0deg)';
                    setTimeout(() => ball.style.transition = 'all 0.5s', 50); 
                }, 1000);
            }, 500);
        };
    </script>
</body>
</html>
